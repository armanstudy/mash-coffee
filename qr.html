<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR کد منوی مش کافی</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Lalezar&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
  :root{ --ink:#2B1D15; --accent:#C0721C; --ground:#FBF4EA; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--ground); color:var(--ink); font-family:"Vazirmatn",sans-serif;
    direction:rtl; padding:24px;
  }
  .card{
    background:#fff; border-radius:20px; padding:36px 32px; text-align:center;
    box-shadow:0 8px 30px rgba(43,29,21,.12); max-width:360px; width:100%;
  }
  h1{ font-family:"Lalezar",sans-serif; font-weight:400; font-size:1.8rem; margin:0 0 4px; }
  p.sub{ margin:0 0 20px; color:#7B5F4C; font-size:.9rem; }
  #qr-img{ display:block; width:260px; max-width:100%; aspect-ratio:1/1; margin:0 auto; border-radius:12px; }
  .actions{ margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap }
  a.btn, button.btn{
    display:inline-block; padding:9px 18px; border-radius:10px; text-decoration:none;
    background:var(--accent); color:#fff; font-weight:500; border:none; cursor:pointer; font-family:inherit; font-size:.9rem;
  }
  a.btn.outline{ background:none; color:var(--accent); border:1px solid var(--accent); }
  @media print{
    body{background:#fff}
    .actions, p.sub{display:none}
    .card{box-shadow:none}
  }
</style>
</head>
<body>
  <div class="card">
    <h1>مش کافی</h1>
    <p class="sub">برای دیدن منو، کد را اسکن کنید</p>
    <img id="qr-img" alt="QR کد منو" hidden>
    <p id="qr-fallback" class="sub" hidden>نمایش تصویر QR ممکن نشد. برای دیدن منو مستقیم روی لینک زیر بزنید:<br><a id="fallback-link" target="_blank"></a></p>
    <div class="actions">
      <button class="btn" onclick="window.print()">چاپ</button>
      <a class="btn outline" id="dl-link" download="qr-mash-coffee.png" hidden>دانلود عکس</a>
      <a class="btn outline" id="site-link" target="_blank">مشاهدهٔ منو</a>
    </div>
  </div>

<script>
  var SITE_URL = 'https://armanstudy.github.io/mash-coffee/';
  document.getElementById('site-link').href = SITE_URL;

  if (typeof QRCode === 'undefined'){
    showFallback();
  } else {
    QRCode.toDataURL(SITE_URL, { width: 480, margin: 1, color: { dark: '#2B1D15', light: '#FFFFFF' } }, function (err, url) {
      if (err){ showFallback(); return; }
      var img = document.getElementById('qr-img');
      img.src = url;
      img.hidden = false;
      var dl = document.getElementById('dl-link');
      dl.href = url;
      dl.hidden = false;
    });
  }

  function showFallback(){
    var f = document.getElementById('fallback-link');
    f.href = SITE_URL; f.textContent = SITE_URL;
    document.getElementById('qr-fallback').hidden = false;
  }
</script>
</body>
</html>
